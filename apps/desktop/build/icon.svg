<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#2f6be8"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7fb"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>

  <!-- 书页厚度（底部边缘） -->
  <path d="M256 158 L120 198 L120 366 L256 326 Z" fill="#c9dcfb"/>
  <path d="M256 158 L392 198 L392 366 L256 326 Z" fill="#bcd4f7"/>

  <!-- 左右书页 -->
  <path d="M256 148 L120 190 L120 356 L256 312 Z" fill="#f4f7fd"/>
  <path d="M256 148 L392 190 L392 356 L256 312 Z" fill="#ffffff"/>

  <!-- 书脊 -->
  <path d="M250 150 L262 150 L262 310 L250 310 Z" fill="url(#spine)"/>

  <!-- 左页文本行（markdown） -->
  <rect x="148" y="212" width="82" height="12" rx="6" fill="#c9dcfb"/>
  <rect x="148" y="244" width="82" height="12" rx="6" fill="#c9dcfb"/>
  <rect x="148" y="276" width="52" height="12" rx="6" fill="#3d8bfd"/>

  <!-- 右页文本行 -->
  <rect x="282" y="212" width="82" height="12" rx="6" fill="#c9dcfb"/>
  <rect x="282" y="244" width="82" height="12" rx="6" fill="#c9dcfb"/>
  <rect x="282" y="276" width="58" height="12" rx="6" fill="#3d8bfd"/>
</svg>
