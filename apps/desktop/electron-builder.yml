appId: com.booktool.app
productName: BookTool
artifactName: booktool-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
# 运行时子进程/窗口需要真实文件系统路径（Typst 读字体、窗口图标），不进 asar；
# extraResources 的 to 相对 app 的 resources/ 目录
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/icon.png
    to: icon.png
linux:
  executableName: booktool
  target:
    - deb
    - AppImage
  category: Office
  icon: build/icon.png
  maintainer: min
  synopsis: Markdown 书籍写作与出版工作台
  description: BookTool —— Markdown → Typst → PDF 的书籍写作、所见即所得编辑与出版工具
deb:
  depends: []
